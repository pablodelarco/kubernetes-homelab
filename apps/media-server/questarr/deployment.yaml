apiVersion: apps/v1
kind: Deployment
metadata:
  name: questarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: questarr
  template:
    metadata:
      labels:
        app: questarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 127.0.0.1
        options:
        - name: ndots
          value: '1'
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - worker
      initContainers:
      - name: gluetun
        image: qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
            - MKNOD
            - CHOWN
            - SETUID
            - SETGID
            - DAC_OVERRIDE
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: VPN_SERVICE_PROVIDER
          value: nordvpn
        - name: SERVER_COUNTRIES
          value: Switzerland
        - name: FIREWALL_INPUT_PORTS
          value: 5000,9999
        # Only the existing qBittorrent ClusterIP; no cluster/LAN-wide bypass.
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 10.43.204.85/32
        - name: HEALTH_SERVER_ADDRESS
          value: 0.0.0.0:9999
        - name: DNS_ADDRESS
          value: 127.0.0.1
        - name: DNS_KEEP_NAMESERVER
          value: 'off'
        - name: TZ
          value: Europe/Madrid
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              name: nordvpn-secrets
              key: NORDVPN_USER
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nordvpn-secrets
              key: NORDVPN_PASSWORD
        - name: SERVER_HOSTNAMES
          value: ch352.nordvpn.com
        startupProbe:
          httpGet: &id001
            path: /
            port: 9999
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet: *id001
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        - name: vpn-data
          mountPath: /gluetun
      - name: prepare-data
        image: ghcr.io/doezer/questarr:v1.5.0@sha256:8b6a6df437aa3983a4ccffe164f3f33f664646c48cde05d263434e9768598621
        command:
        - sh
        - -c
        - id; ls -ld /app/data; touch /app/data/server.log; test -w /app/data/server.log
        securityContext: &id002
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: &id003
            drop:
            - ALL
          seccompProfile: &id004
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: questarr
        image: ghcr.io/doezer/questarr:v1.5.0@sha256:8b6a6df437aa3983a4ccffe164f3f33f664646c48cde05d263434e9768598621
        command:
        - node
        - dist/server/index.js
        securityContext: *id002
        env:
        - name: SQLITE_DB_PATH
          value: /app/data/sqlite.db
        - name: NODE_ENV
          value: production
        - name: PORT
          value: '5000'
        - name: APP_URL
          value: http://questarr.homelab:15000
        - name: ALLOWED_ORIGINS
          value: http://questarr.homelab:15000
        - name: TRUST_PROXY
          value: '1'
        ports:
        - containerPort: 5000
          name: http
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/server.log
          subPath: server.log
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          periodSeconds: 10
          initialDelaySeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          periodSeconds: 30
          initialDelaySeconds: 60
      - name: prowlarr-questarr
        image: lscr.io/linuxserver/prowlarr:2.6.5@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
        command:
        - /app/prowlarr/bin/Prowlarr
        - -nobrowser
        - -data=/config
        workingDir: /app/prowlarr/bin
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: *id003
          seccompProfile: *id004
        env:
        - name: HOME
          value: /config
        - name: TMPDIR
          value: /tmp
        - name: PROWLARR__SERVER__BINDADDRESS
          value: 127.0.0.1
        - name: PROWLARR__AUTH__METHOD
          value: External
        - name: PROWLARR__AUTH__REQUIRED
          value: Enabled
        volumeMounts:
        - name: prowlarr-data
          mountPath: /config
        - name: prowlarr-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - wget -q -O /dev/null http://127.0.0.1:9696/ping
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - wget -q -O /dev/null http://127.0.0.1:9696/ping
          initialDelaySeconds: 90
          periodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: questarr
      - name: tmp
        emptyDir: {}
      - name: vpn-data
        emptyDir: {}
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      - name: prowlarr-data
        persistentVolumeClaim:
          claimName: prowlarr-questarr
      - name: prowlarr-tmp
        emptyDir: {}
