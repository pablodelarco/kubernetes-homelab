apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
data:
  recyclarr.yml: |
    # Recyclarr v8 config — TRaSH Guides sync for Sonarr and Radarr.
    # Profile and group IDs are generated from the official v8 templates.

    sonarr:
      sonarr-main:
        base_url: http://sonarr.media.svc.cluster.local
        api_key: !env_var SONARR_API_KEY

        quality_definition:
          type: series

        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3 # Golden Rule HD
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4 # Language Profiles
            - trash_id: 85fae4a2294965b75710ef2989c850eb # Streaming Services HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f # Unwanted Formats

    radarr:
      radarr-main:
        base_url: http://radarr.media.svc.cluster.local
        api_key: !env_var RADARR_API_KEY

        quality_definition:
          type: movie

        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # Golden Rule HD
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # Unwanted Formats
