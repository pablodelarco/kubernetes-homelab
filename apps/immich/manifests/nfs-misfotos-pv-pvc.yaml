# "Mis Fotos" on the Murcia Synology DS213+ (192.168.1.42), reached through the
# DH2300-Murcia subnet route. Read-write: Pablo approved (2026-10-31) that
# Immich may delete and modify these originals. DSM export rule is Read/Write
# for client 192.168.1.75 with "Map all users to admin".
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-misfotos
spec:
  capacity:
    storage: 200Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.0
    - hard
    - timeo=600
    - retrans=2
    - noatime
    - rsize=131072
    - tcp
  nfs:
    server: 192.168.1.42
    path: "/volume1/Mis Fotos"
    readOnly: false
  claimRef:
    namespace: immich
    name: immich-misfotos
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-misfotos
  namespace: immich
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: immich-misfotos
  resources:
    requests:
      storage: 200Gi
