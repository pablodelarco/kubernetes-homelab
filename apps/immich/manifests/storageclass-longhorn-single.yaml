# Single-replica Longhorn class for regenerable data (thumbnails, encoded
# video, ML model cache). strict-local + WaitForFirstConsumer keeps the only
# replica on the node that runs the pod (Immich is pinned to worker).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: "strict-local"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataEngine: "v1"
