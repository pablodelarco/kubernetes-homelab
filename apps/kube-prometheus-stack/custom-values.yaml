defaultRules:
  disabled:
    # N-1 memory capacity is not an actionable SLO for this heterogeneous
    # two-node homelab. A total-capacity rule below remains active.
    KubeMemoryOvercommit: true

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: ["__name__"]
        regex: "(apiserver|etcd)_.+_bucket"

kubeControllerManager:
  # k3s embeds this component and exposes no standalone metrics target.
  enabled: false
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: ["__name__"]
        regex: ".+_bucket"

kubeProxy:
  # k3s uses Cilium instead of kube-proxy.
  enabled: false

kubeScheduler:
  # k3s embeds this component and exposes no standalone metrics target.
  enabled: false

crds:
  create: true

grafana:
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false  # Disabled - using Cilium Gateway API instead
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  plugins:
    - victoriametrics-logs-datasource
  additionalDataSources:
    - name: VictoriaLogs
      type: victoriametrics-logs-datasource
      access: proxy
      url: http://victoria-logs-victoria-logs-single-server.victoria-logs.svc.cluster.local:9428
      isDefault: false
  # Prefer scheduling on worker node to balance cluster load
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - worker

prometheus:
  prometheusSpec:
    remoteWriteDashboards: false
    serverSideApply: true
    # Discover GitOps-managed monitors and rules across all namespaces. Several
    # external charts previously used the old kube-prometheus-stack release label
    # and were silently excluded from Prometheus.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    retention: 12h
    # 30 min margin for WAL replay on cold start (default is 15 min, insufficient
    # if WAL grows large after a crash storm — see WAL pathology incident 2026-05-06).
    # prometheus-operator v0.89 does NOT expose startupProbe as a top-level field,
    # override via containers[] patch on the prometheus container.
    containers:
      - name: prometheus
        startupProbe:
          httpGet:
            path: /-/ready
            port: http-web
            scheme: HTTP
          periodSeconds: 15
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 120
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        memory: 2Gi
        cpu: 200m
      limits:
        memory: 4Gi
        cpu: 2
    # Schedule on worker node to offload beelink (control-plane is memory-constrained at 16GB)
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker

alertmanager:
  config:
    global:
      resolve_timeout: 5m
      telegram_api_url: "https://api.telegram.org"
    receivers:
      - name: "null"
      - name: "telegram"
        telegram_configs:
          - bot_token_file: "/etc/alertmanager/secrets/alertmanager-telegram-secret/bot_token"
            chat_id: 308055748
            parse_mode: "HTML"
            message: |
              {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }} <b>{{ .Status | toUpper }}</b>
              {{ range .Alerts }}
              <b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
      - name: "claw-webhook"
        webhook_configs:
          - url: "http://raspberrypi5:9998/webhook"
            send_resolved: true
            max_alerts: 10
    route:
      receiver: "telegram"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"
        - matchers:
            - alertname = "InfoInhibitor"
          receiver: "null"
        # NodeSystemSaturation is too noisy for an overcommitted 2-node cluster
        - matchers:
            - alertname = "NodeSystemSaturation"
          receiver: "null"
        # K3s version skew between nodes is expected during rolling upgrades
        - matchers:
            - alertname = "KubeVersionMismatch"
          receiver: "null"
        - matchers:
            - severity = "critical"
          receiver: "telegram"
          repeat_interval: 1h
        - matchers:
            - severity = "warning"
          receiver: "telegram"
          repeat_interval: 4h
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal: [namespace, alertname]
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal: [namespace, alertname]
  alertmanagerSpec:
    secrets:
      - alertmanager-telegram-secret
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    # Schedule on worker to reduce beelink memory pressure
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - worker

# kubeStateMetrics - using default configuration (no affinity)

additionalPrometheusRulesMap:
  cluster-alerts:
    groups:
      - name: node-alerts
        rules:
          - alert: HighCPUUsage
            expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) > 0.8
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High CPU usage on {{ $labels.instance }}"
              description: "CPU usage is {{ $value | humanizePercentage }} for 5 minutes."
          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High memory usage on {{ $labels.instance }}"
              description: "Memory usage is {{ $value | humanizePercentage }} for 5 minutes."
          - alert: MemoryWarning
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.80
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Memory usage rising on {{ $labels.instance }}"
              description: "Memory usage is {{ $value | humanizePercentage }} for 15 minutes."
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} is down"
              description: "Node has been unreachable for 2 minutes."
          - alert: HighDiskUsage
            expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Disk usage high on {{ $labels.instance }}"
              description: "Filesystem {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full."
          - alert: DiskAlmostFull
            expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Disk almost full on {{ $labels.instance }}"
              description: "Filesystem {{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full."
      - name: pod-alerts
        rules:
          - alert: CrashLoopBackOff
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crashing"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is in CrashLoopBackOff."
          - alert: PodOOMKilled
            expr: |
              (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
              and on (namespace, pod, container)
              (time() - kube_pod_container_status_last_terminated_timestamp < 900)
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} was OOM killed"
              description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was killed due to OOM."
          - alert: PodNotReady
            expr: kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} not ready"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been {{ $labels.phase }} for 15 minutes."
          - alert: TooManyRestarts
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} restarting frequently"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has restarted {{ $value | humanize }} times in the last hour."
      - name: kubernetes-alerts
        rules:
          - alert: KubeNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is not ready"
              description: "Kubernetes node {{ $labels.node }} has been NotReady for 5 minutes."
          - alert: KubeNodeMemoryPressure
            expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} has memory pressure"
              description: "Kubernetes node {{ $labels.node }} is under memory pressure — pods may be evicted."
          - alert: KubeMemoryRequestsExceedCapacity
            expr: sum(namespace_memory:kube_pod_container_resource_requests:sum{}) > sum(kube_node_status_allocatable{resource="memory"})
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod memory requests exceed total cluster capacity"
              description: "Requested memory exceeds total allocatable memory; new pods may remain Pending."
          - alert: PersistentVolumeFillingUp
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.8
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} filling up"
              description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is {{ $value | humanizePercentage }} full — plan expansion or cleanup."
          - alert: PersistentVolumeAlmostFull
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.95
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} almost full"
              description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is {{ $value | humanizePercentage }} full — imminent CrashLoop risk."
      - name: longhorn-alerts
        rules:
          - alert: LonghornVolumeDegraded
            expr: longhorn_volume_robustness{state="degraded"} == 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} is degraded"
              description: "Volume {{ $labels.volume }} (PVC {{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has lost replica redundancy."
          - alert: LonghornVolumeFaulted
            expr: longhorn_volume_robustness{state="faulted"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} is faulted"
              description: "Volume {{ $labels.volume }} (PVC {{ $labels.pvc_namespace }}/{{ $labels.pvc }}) may have data at risk."
          - alert: LonghornNodeDown
            expr: longhorn_node_status{condition="ready"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Longhorn node {{ $labels.node }} is unavailable"
              description: "Longhorn storage operations on {{ $labels.node }} may fail."
          - alert: LonghornDiskSpaceLow
            expr: longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn disk usage is high on {{ $labels.node }}"
              description: "Longhorn storage usage is {{ $value | humanizePercentage }}."
          - alert: LonghornVolumeSingleReplica
            expr: |
              count by (volume) (longhorn_replica_state{state="running"} == 1) < 2
              and on (volume)
              label_replace(kube_persistentvolumeclaim_info{storageclass="longhorn"}, "volume", "$1", "volumename", "(.*)")
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn volume {{ $labels.volume }} has fewer than two replicas"
              description: "An active Longhorn PVC has lost node-level redundancy."
          - alert: LonghornBackupMissing
            expr: |
              longhorn_volume_last_backup_at{pvc!~"prometheus-.*"} == 0
              and on (volume)
              label_replace(kube_persistentvolumeclaim_info{storageclass="longhorn"}, "volume", "$1", "volumename", "(.*)")
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Longhorn PVC {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no backup"
              description: "This active Longhorn volume has never completed an external backup."
          - alert: LonghornBackupStale
            expr: |
              (time() - longhorn_volume_last_backup_at{pvc!~"prometheus-.*"} > 129600)
              and (longhorn_volume_last_backup_at{pvc!~"prometheus-.*"} > 0)
              and on (volume)
              label_replace(kube_persistentvolumeclaim_info{storageclass="longhorn"}, "volume", "$1", "volumename", "(.*)")
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: "Longhorn backup is stale for {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
              description: "The last completed external backup is older than 36 hours."

prometheusOperator:
  # Removed affinity to beelink - let it run on any available node
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule