image:
  repository: renovatebot/renovate
  tag: "44.238.3@sha256:fb2cb3fa86241eba7098491aa1b070313fc51f5c0688122b19787bceaee4beba"
  pullPolicy: IfNotPresent

# Renovate Helm Chart Values
# Automatically updates Helm charts and container images

cronjob:
  # Run every 2 hours
  # Every 6 h (UTC): 01/07/13/19 CET, clear of the 03:00-05:30 backup window.
  schedule: '0 */6 * * *'
  
  # Job history
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  
  # Concurrency
  concurrencyPolicy: Forbid

renovate:
  # Platform configuration
  platform: github
  endpoint: https://api.github.com/
  
  # Repository to scan
  autodiscover: false
  
  # Logging
  logLevel: info
  
  # Git configuration
  gitAuthor: "Renovate Bot <bot@renovateapp.com>"
  
  # Renovate config file
  config: |
    {
      "repositories": ["pablodelarco/kubernetes-homelab"],
      "extends": [
        "config:recommended"
      ],
      "timezone": "Europe/Madrid",
      "semanticCommits": "enabled",
      "dependencyDashboard": true,
      "dependencyDashboardTitle": "🤖 Renovate Dashboard",
      "suppressNotifications": ["prEditedNotification"],
      "rebaseWhen": "conflicted",
      "schedule": ["at any time"],
      "gitAuthor": "Renovate Bot <bot@renovateapp.com>",
      "platformCommit": true,
      "enabledManagers": ["argocd", "helm-values", "kubernetes"],
      "argocd": {
        "fileMatch": ["argocd-apps/.+\\.ya?ml$"]
      },
      "kubernetes": {
        "fileMatch": [
          "cluster/.+\\.ya?ml$"
        ]
      },
      "packageRules": [
        {
          "description": "Auto-merge all updates",
          "matchUpdateTypes": ["minor", "patch", "pin", "digest"],
          "automerge": true,
          "automergeType": "branch",
          "platformAutomerge": false
        },
        {
          "description": "Auto-merge major updates for non-critical apps",
          "matchUpdateTypes": ["major"],
          "excludePackageNames": ["longhorn", "kube-prometheus-stack"],
          "automerge": true,
          "automergeType": "branch",
          "platformAutomerge": false
        },
        {
          "description": "Create PR for major updates of critical apps",
          "matchUpdateTypes": ["major"],
          "matchPackageNames": ["longhorn", "kube-prometheus-stack"],
          "automerge": false
        }
      ]
    }

# Secret for GitHub token
# The secret should contain RENOVATE_TOKEN environment variable
existingSecret: renovate-secret

# Resources
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Prefer worker, but allow beelink when the worker cannot fit the request.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker

# Tolerate control-plane taint
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
