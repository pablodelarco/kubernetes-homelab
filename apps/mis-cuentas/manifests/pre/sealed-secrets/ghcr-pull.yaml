# PLANTILLA SIN VALORES. bash deploy/homelab/seal-secrets.sh sustituye este fichero por el
# SealedSecret de verdad, cifrado con la clave pública de sealed-secrets-controller.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: mis-cuentas-pre
spec:
  encryptedData:
    .dockerconfigjson: SELLAR_CON_seal-secrets.sh
  template:
    metadata:
      name: ghcr-pull
      namespace: mis-cuentas-pre
    type: kubernetes.io/dockerconfigjson
