# PLANTILLA SIN VALORES. bash deploy/homelab/seal-secrets.sh sustituye este fichero por el
# SealedSecret de verdad, cifrado con la clave pública de sealed-secrets-controller.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: verifactu-worker
  namespace: mis-cuentas-pre
spec:
  encryptedData:
    VERCEL_AUTOMATION_BYPASS_SECRET: SELLAR_CON_seal-secrets.sh
    WORKER_DATABASE_URL: SELLAR_CON_seal-secrets.sh
    WORKER_TOKEN: SELLAR_CON_seal-secrets.sh
  template:
    metadata:
      name: verifactu-worker
      namespace: mis-cuentas-pre
    type: Opaque
