apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: glances
  namespace: glances
  labels:
    app: glances
spec:
  selector:
    matchLabels:
      app: glances
  template:
    metadata:
      labels:
        app: glances
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: glances
          image: nicolargo/glances:4.5.9-full@sha256:0b309652e8a4f2e827b823609044b9976b309765517760c0383d2e4f73f756c5
          ports:
            - containerPort: 61208
              hostPort: 61208
              protocol: TCP
          env:
            - name: GLANCES_OPT
              value: "-w"
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /api/4/version
              port: 61208
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /rootfs
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
