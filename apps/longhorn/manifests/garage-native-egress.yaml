apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-native-egress
  namespace: longhorn-system
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn 256

    defaults
      log global
      mode tcp
      option tcplog
      timeout connect 5s
      timeout client 1h
      timeout server 1h

    frontend garage_s3
      bind :13900
      acl from_pods src 10.42.0.0/16
      acl from_beelink src 10.10.1.37/32
      acl from_worker src 10.10.1.39/32
      tcp-request connection reject if !from_pods !from_beelink !from_worker
      default_backend garage_native

    backend garage_native
      option tcp-check
      server garage 100.96.235.59:3900 check inter 5s fall 3 rise 2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: garage-native-egress
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-native-egress
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-native-egress
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: haproxy
          image: haproxy:3.2-alpine@sha256:6343ce34a132a5dceaa24767d739df2bd519f8f7c1079ae39e4821334e8eb42e
          args:
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          ports:
            - name: s3-proxy
              containerPort: 13900
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: s3-proxy
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: s3-proxy
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 99
            runAsGroup: 99
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: garage-native-egress
---
apiVersion: v1
kind: Service
metadata:
  name: garage-native-egress
  namespace: longhorn-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage-native-egress
  ports:
    - name: s3
      port: 3900
      targetPort: s3-proxy
      protocol: TCP
