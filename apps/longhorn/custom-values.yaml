persistence:
  defaultClass: true
  # 2-node cluster (beelink + worker). Helm chart default is 3 replicas
  # with anti-affinity, so the 3rd is always unschedulable → "degraded".
  # Forcing 2 here aligns the StorageClass with cluster topology.
  defaultClassReplicaCount: 2
  # Retain by default — prevents data loss when PVCs get
  # deleted/recreated (e.g. ArgoCD force-sync). Orphaned PVs need
  # manual cleanup, which is an acceptable tradeoff for safety.
  reclaimPolicy: Retain
  # Automatically enable the protected backup group for all new volumes.
  # Group name MUST match the RecurringJob.spec.groups value. The actual
  # RecurringJob 'default-backup' targets group 'protected'.
  # Mismatch = volumes get wrong label = not picked up by backup schedule.
  recurringJobSelector:
    enable: true
    jobList: '[{"name":"protected","isGroup":true}]'

defaultSettings:
  backupTarget: "s3://k8s-backups@us-east-1/"
  backupTargetCredentialSecret: "garage-credentials"
  defaultReplicaCount: 2
  # Garage on NAS/NFS can exceed Longhorn's 1-minute default while listing the
  # backup store under load. Avoid transient target unavailability and skipped PVCs.
  backupExecutionTimeout: 10
  # Back up PVCs even when their workload is stopped at 03:00.
  allowRecurringJobWhileVolumeDetached: true
  recurringSuccessfulJobsHistoryLimit: 1
  recurringFailedJobsHistoryLimit: 1

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
    interval: 60s

service:
  ui:
    type: ClusterIP
    port: 80

# Allow Longhorn to run on control-plane nodes
longhornManager:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

longhornDriver:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

longhornUI:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# CSI sidecar replicas — match node count (2 nodes = 2 replicas max)
csi:
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

# Persist the backup schedule in GitOps. The previous object existed only in
# live cluster state and would disappear on a Longhorn reinstall.
extraObjects:
  - apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: default-backup
      namespace: longhorn-system
    spec:
      name: default-backup
      cron: "0 3 * * *"
      task: backup
      groups:
        - protected
      retain: 7
      concurrency: 1
      # Re-upload every block weekly. This repairs backend block loss that an
      # incremental backup can otherwise keep referencing indefinitely.
      parameters:
        full-backup-interval: "7"
      labels:
        type: scheduled-backup
