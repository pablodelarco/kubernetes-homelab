apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: questarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pablodelarco/kubernetes-homelab
    targetRevision: main
    path: apps/media-server/questarr
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
