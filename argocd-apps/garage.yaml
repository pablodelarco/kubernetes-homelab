apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://datahub-local.github.io/garage-helm'
      chart: garage
      targetRevision: 0.2.1
      helm:
        valueFiles:
          - $values/apps/garage/custom-values.yaml
    - repoURL: 'https://github.com/pablodelarco/kubernetes-homelab'
      targetRevision: main
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: garage
  # Chart 0.2.1 generates a random checksum/secret on every render even when
  # garage.secret.create=false. Ignore only that nondeterministic annotation;
  # otherwise every Git revision rolls Garage and interrupts Longhorn backups.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: garage
      namespace: garage
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
    - group: apps
      kind: Deployment
      name: garage-webui
      namespace: garage
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
